# web Deployment: the Next.js standalone server (built from the app repository's
# apps/web/Dockerfile). Runtime config and secrets come from the hand-made
# web-secrets Secret via envFrom (template: templates/web-secrets.example.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_SERVICE_NAME}-${APP_ENV}
  namespace: ${APP_NAMESPACE}-${APP_ENV}
  labels:
    app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
    spec:
      # The app never calls the Kubernetes API, so it gets no service-account token.
      automountServiceAccountToken: false
      # The image runs as a numeric non-root user, checked by the app repo CI.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${APP_IMAGE_REPO}:${APP_IMAGE_TAG}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The image CMD copies WEB_PORT (image default, see deployment/k3s-traefik.md section 4)
          # into PORT. Setting PORT here makes APP_PORT the listen port. Keep in sync with the image
          # CMD. It is a command and not an env entry because after Flux substitution
          # value: "${APP_PORT}" reaches the API server as an int and is rejected.
          command: ["sh", "-c", "PORT=${APP_PORT} exec node apps/web/server.js"]
          # Unquoted on purpose: ports must be ints after substitution.
          ports:
            - name: http
              containerPort: ${APP_PORT}
          envFrom:
            - secretRef:
                name: web-secrets
          env:
            # Next's standalone server binds to $HOSTNAME. The image sets 0.0.0.0, but container
            # runtimes also set HOSTNAME (to the pod name); pinning it here makes the bind address
            # independent of how the runtime orders the two.
            - name: HOSTNAME
              value: "0.0.0.0"
          # `/` renders the home page, so a 200 means the Next server answers.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # The 8s timeout covers a slow cms-api call while `/` renders.
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
