# web's k8s resources, applied by the Flux Kustomization web-sync (cluster-base/web-sync.yaml).
# Every ${APP_*} placeholder is substituted by Flux (postBuild) from the shared-configmap and web-configmap
# ConfigMaps in the environment's namespace (templates: templates/shared-configmap.example.yaml,
# templates/web-configmap.example.yaml), plus APP_IMAGE_TAG from cluster/me/<env>/web-sync-overlay.yaml,
# which the app repository updates. No project values live here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - ingress.yaml
