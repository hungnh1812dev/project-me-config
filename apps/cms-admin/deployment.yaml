# cms-admin Deployment: the static SPA on nginx (apps/cms-admin/Dockerfile). The cms-api URL is baked
# into the image at build time (VITE_API_BASE_URL, https://api.<domain>/api/v1). Runtime values come from the hand-made admin-secrets
# Secret via envFrom (template: templates/admin-secrets.example.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_SERVICE_NAME}-${APP_ENV}
  namespace: ${APP_NAMESPACE}-${APP_ENV}
  labels:
    app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
    spec:
      # Static files only: no Kubernetes API access needed.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${APP_IMAGE_REPO}:${APP_IMAGE_TAG}
          # nginx-unprivileged (uid 101) listens on 8080 and needs no capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # nginx-unprivileged listens on 8080; an image fact, not a project value.
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: admin-secrets
          # nginx serves index.html at / (no upstream involved), so neither probe depends on cms-api.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
