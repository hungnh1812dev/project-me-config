# Local CA of the tier 3 stack (ADR-0003 section 3). Applied by tier3-stack/cluster.sh, not by the Flux root:
# the CA Certificate and its Secret must stay in the cert-manager namespace, which the root's namespace
# transform would change. Self-signed issuer -> CA Certificate -> ClusterIssuer tier3-ca.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: tier3-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tier3-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: project-me-tier3-ca
  secretName: tier3-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: tier3-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: tier3-ca
spec:
  ca:
    secretName: tier3-ca
