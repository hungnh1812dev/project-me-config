# backup-secrets: the whole runtime config of the backup CronJob, loaded through envFrom. Only that
# job reads it; cms-api never does. The backup CronJob is not planned yet (decision 2026-10-27): this
# template is ready for when one is added.
# The rclone token here is the write-capable job token. It is never the read-only token that
# api-secrets holds as BACKUP_STORAGE_ACCESS_KEY_ID / BACKUP_STORAGE_SECRET_ACCESS_KEY.
# BACKUP_AGE_RECIPIENT is a public key. The matching private age key is never in the cluster or in git.
# Placeholders only; never commit real values. Created by hand before the job first runs:
#   cp templates/backup-secrets.example.yaml templates/backup-secrets.yaml   # gitignored; fill in values
#   kubectl apply --server-side -f templates/backup-secrets.yaml
# (--server-side: a plain `kubectl apply` would also store every value in plain text in the
# last-applied-configuration annotation.)
# The namespace <app-namespace>-<app-env> must exist first (kubectl create namespace ...).
# Production: keep the encrypted copy with SOPS (deployment/k3s-secrets-sops.md section 4).
#
# Rotation: set the role password with \password at a psql prompt (deployment/supabase-database.md
# step S4), then update DB_PASSWORD here and re-apply. No restart is needed: the next scheduled run
# reads the new value. Bucket tokens: deployment/k3s-secrets-sops.md section 7.
# If BACKUP_PREFIX changes, change the R2 lifecycle and bucket lock prefixes too
# (deployment/k3s-traefik.md section 7, "Off-site bucket").
#
# Rules for values:
# - Quote every value: Secret data must be strings.
# - Optional keys are commented out. Uncomment only the ones you use.
# - metadata.name is fixed (backup-secrets): the CronJob's envFrom references it.
# - The job mounts database-ca-configmap (templates/database-ca-configmap.example.yaml) and
#   PGSSLROOTCERT must point to the mounted ca.crt.
# Values per key: deployment/k3s-secrets-sops.md section 2, deployment/supabase-database.md
# sections 5 and 7, deployment/k3s-traefik.md section 7.
apiVersion: v1
kind: Secret
metadata:
  name: backup-secrets
  namespace: <app-namespace>-<app-env>
type: Opaque
stringData:
  # ══ secret values ════════════════════════════════════════════════════════════
  # Backup role: read-only on the dumped schemas. Supabase: <backup-role>.<project-ref>.
  DB_USERNAME: "<backup-role>.<project-ref>"
  DB_PASSWORD: "<db-password>"

  # Write-capable bucket token of the job, limited to the backup bucket.
  RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: "<write-access-key-id>"
  RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: "<write-secret-access-key>"

  # ══ plain settings (not secret per the docs; here because only the job reads them) ═══════════
  # Same values as DB_HOST, DB_PORT and DB_NAME in api-secrets (session pooler).
  DB_HOST: "<db-host>"
  # Docs value: 5432 (session pooler); never 6543.
  DB_PORT: "<db-port>"
  DB_NAME: "<db-name>"
  # Docs value: verify-full on Supabase.
  PGSSLMODE: "<db-ssl-mode>"
  # Absolute path of the mounted CA file; required with verify-full.
  PGSSLROOTCERT: "<ca-file-path>"

  BACKUP_BUCKET: "<bucket>"
  # Docs value: postgres/ (keeps the trailing slash).
  BACKUP_PREFIX: "<prefix>"
  # Docs values: 400000000 (80 percent of the free 500 MB limit; warns, still dumps, then exits 1)
  # and 200000000.
  BACKUP_MAX_DATABASE_BYTES: "<bytes>"
  BACKUP_MAX_DUMP_BYTES: "<bytes>"

  # rclone remote named offsite, set through RCLONE_CONFIG_OFFSITE_* variables.
  # Docs values: s3 and Cloudflare.
  RCLONE_CONFIG_OFFSITE_TYPE: "<rclone-type>"
  RCLONE_CONFIG_OFFSITE_PROVIDER: "<rclone-provider>"
  RCLONE_CONFIG_OFFSITE_ENDPOINT: "https://<account-id>.<object-storage-host>"
  # Docs value: true (the token cannot create buckets).
  RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "<true-or-false>"
  # Public age key; encrypts each dump.
  BACKUP_AGE_RECIPIENT: "<age-public-key>"

  # Only when the pod is killed for memory during the upload.
  # RCLONE_S3_UPLOAD_CONCURRENCY: "<concurrency>"
  # RCLONE_S3_CHUNK_SIZE: "<chunk-size>"
