# api-init-secrets: the cms-api init container's whole runtime config, loaded through envFrom. It is
# the init container's only source; the main container never reads it (it reads api-secrets,
# templates/api-secrets.example.yaml). The init container runs deploy:migrate, which reads only DB_*
# and NODE_ENV, so this Secret holds no app secret.
# In both credential modes the init container reads this Secret. Mode A: it holds the same database
# account as api-secrets (deployment/devops-runbook.md section 4.6). Mode B: the migration role.
# Placeholders only; never commit real values. Created by hand before the first Flux deploy:
#   cp templates/api-init-secrets.example.yaml templates/api-init-secrets.yaml   # gitignored; fill in values
#   kubectl apply --server-side -f templates/api-init-secrets.yaml
# (--server-side: a plain `kubectl apply` would also store every value in plain text in the
# last-applied-configuration annotation.)
# The namespace <app-namespace>-<app-env> must exist first (kubectl create namespace ...).
# Production: keep the encrypted copy with SOPS (deployment/k3s-secrets-sops.md section 4).
#
# Rotation: reset the migrator password (Supabase: dashboard), then update DB_PASSWORD here and
# re-apply. No restart is needed: the next rollout's init container reads the new value.
# A change to a shared database setting (the six marked below) goes into both api-secrets and this
# Secret.
#
# Rules for values:
# - Quote every value: Secret data must be strings.
# - metadata.name is fixed (api-init-secrets): the Deployment's init container references it.
# Values per key: deployment/supabase-database.md sections 4 and 5, deployment/k3s-secrets-sops.md
# section 6.
apiVersion: v1
kind: Secret
metadata:
  name: api-init-secrets
  namespace: <app-namespace>-<app-env>
type: Opaque
stringData:
  # ══ secret values ════════════════════════════════════════════════════════════
  # Migration login. Supabase docs default: postgres; self-managed: the migrator role. Mode A: the
  # same login as DB_USERNAME in api-secrets.
  DB_USERNAME: "<migrator-role>.<project-ref>"
  DB_PASSWORD: "<db-password>"

  # ══ plain settings (same value as in api-secrets) ════════════════════════════
  # Docs value: production.
  NODE_ENV: "<node-env>"
  # Session pooler host exactly as in the certificate.
  DB_HOST: "<db-host>"
  # Docs value: 5432 (session pooler); never 6543.
  DB_PORT: "<db-port>"
  DB_NAME: "<db-name>"
  # Docs value: verify-full on Supabase. Needs the database-ca-configmap mounted in the init container.
  DB_SSL_MODE: "<db-ssl-mode>"
  # Absolute path of the mounted CA file; required with verify-full.
  DB_SSL_ROOT_CERT_PATH: "<ca-file-path>"
