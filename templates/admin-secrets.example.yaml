# admin-secrets: the cms-admin container's runtime config, loaded through envFrom.
# The deployment docs give cms-admin no secret value (deployment/k3s-secrets-sops.md section 6);
# this Secret exists because the Deployment loads one, so it may stay `stringData: {}`.
# Placeholders only; never commit real values. Created by hand before the first Flux deploy:
#   cp templates/admin-secrets.example.yaml templates/admin-secrets.yaml   # gitignored; fill in values
#   kubectl apply --server-side -f templates/admin-secrets.yaml
# The namespace <app-namespace>-<app-env> must exist first (it's shared with the other apps).
# To change a value later: edit templates/admin-secrets.yaml, re-apply the same way, then
#   kubectl -n <app-namespace>-<app-env> rollout restart deploy/<APP_SERVICE_NAME>-<APP_ENV>
# (pods only read the Secret at start).
# Quote every value: Secret data must be strings. Optional keys are commented out.
# metadata.name is fixed (admin-secrets): the Deployment's envFrom references it.
apiVersion: v1
kind: Secret
metadata:
  name: admin-secrets
  namespace: <app-namespace>-<app-env>
type: Opaque
stringData:
  # plain settings (not secret per the docs; here because only the pod reads them)
  # Space-separated origins for the CSP connect-src. Overrides the value derived from the
  # build-time API URL; set it only if the API origin differs (deployment/k3s-traefik.md section 5).
  # CSP_CONNECT_SRC: "<csp-connect-src>"
