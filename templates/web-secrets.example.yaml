# web-secrets: the web app's runtime config, loaded into the container through envFrom.
# Placeholders only; never commit real values. Created by hand before the first Flux deploy:
#   cp templates/web-secrets.example.yaml templates/web-secrets.yaml   # gitignored; fill in values
#   kubectl apply --server-side -f templates/web-secrets.yaml
# (--server-side: a plain `kubectl apply` would also store every value in plain text in the
# last-applied-configuration annotation.)
# The namespace <app-namespace>-<app-env> must exist first (it's shared with the other apps).
# To change a value later: edit templates/web-secrets.yaml, re-apply the same way, then
#   kubectl -n <app-namespace>-<app-env> rollout restart deploy/<APP_SERVICE_NAME>-<APP_ENV>
# (pods only read the Secret at start).
# The same template is used for staging and prod. After a trim, re-apply it and check that the
# Secret holds only the keys below (kubectl -n <ns> get secret web-secrets -o json | jq -r '.data | keys[]').
#
# Rules for values:
# - Quote every value: Secret data must be strings.
# - Optional keys are commented out. Uncomment only the ones you use.
# - Don't set PORT or WEB_PORT (the Deployment sets PORT from APP_PORT in web-configmap). Project info (APP_*) lives in the
#   ConfigMaps (templates/shared-configmap.example.yaml, templates/web-configmap.example.yaml).
#   NEXT_PUBLIC_* values are build args of the image, not runtime values.
# - metadata.name is fixed (web-secrets): the Deployment's envFrom references it.
# - API URLs: the web server calls cms-api from inside the cluster, so use the cms-api Service
#   rather than the public API host (no round trip through the proxy). Browser-side calls do not
#   use these keys.
# Values per key: deployment/k3s-traefik.md section 4 and deployment/k3s-secrets-sops.md section 6.
# Keys the app reads are documented in apps/web/.env.example in the app repository
# (verification reference only).
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: <app-namespace>-<app-env>
type: Opaque
stringData:
  # plain settings (per the docs: not secret, here because only the pod reads them)
  # cms-api base URL for server-side calls; server-only, never sent to the browser
  # (deployment/k3s-traefik.md section 4). <api-port> equals APP_PORT in api-configmap.
  API_INTERNAL_URL: "http://<api-service-name>.<app-namespace>-<app-env>.svc.cluster.local:<api-port>/api/v1"
  # Seconds the data cache keeps server-side fetches; recommended value: deployment/k3s-traefik.md section 4; 0 disables the cache.
  WEB_REVALIDATE_SECONDS: "<web-revalidate-seconds>"
  # true shows the /status page; unset or false: /status answers 404.
  # WEB_STATUS_PAGE_ENABLED: "<true-or-false>"
