# api-secrets: the cms-api main container's whole runtime config, loaded through envFrom. The init
# container does not read it; it reads api-init-secrets (templates/api-init-secrets.example.yaml),
# which repeats the six shared database settings below. Keep those six equal in both Secrets.
# Placeholders only; never commit real values. Created by hand before the first Flux deploy:
#   cp templates/api-secrets.example.yaml templates/api-secrets.yaml   # gitignored; fill in values
#   kubectl apply --server-side -f templates/api-secrets.yaml
# (--server-side: a plain `kubectl apply` would also store every value in plain text in the
# last-applied-configuration annotation.)
# The namespace <app-namespace>-<app-env> must exist first (kubectl create namespace ...).
# To change a value later: edit templates/api-secrets.yaml, re-apply the same way, then
#   kubectl -n <app-namespace>-<app-env> rollout restart deploy/<APP_SERVICE_NAME>-<APP_ENV>
# (pods only read the Secret at start).
# Production: keep the encrypted copy with SOPS (deployment/k3s-secrets-sops.md section 4);
# rotating a value: deployment/k3s-secrets-sops.md section 7.
#
# Rules for values:
# - Quote every value: Secret data must be strings.
# - Optional keys are commented out. Uncomment only the ones you use. Don't set an optional key to "":
#   an empty value is not "unset" and can fail validation so the app won't boot.
# - Don't set PORT or any APP_*: the Deployment sets PORT from the ConfigMap's APP_PORT, and project
#   info lives in the ConfigMaps (templates/shared-configmap.example.yaml,
#   templates/api-configmap.example.yaml).
# - metadata.name is fixed (api-secrets): the Deployment's envFrom references it.
# - Never set in production (startup fails or the value is for the CLI only): LOGIN_RATE_LIMIT_*,
#   REFRESH_RATE_LIMIT_IP, ALLOW_LOGIN_RATE_LIMIT_OVERRIDE, OWNER_EMAIL, OWNER_DISPLAY_NAME.
# Values per key: deployment/k3s-traefik.md section 6 and deployment/devops-runbook.md section 4.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: <app-namespace>-<app-env>
type: Opaque
stringData:
  # ══ secret values ════════════════════════════════════════════════════════════
  # Database login of the API role. With one login for migrations and the API (mode A) use the
  # migrator login here too (deployment/devops-runbook.md section 4.6).
  DB_USERNAME: "<api-role>.<project-ref>"
  DB_PASSWORD: "<db-password>"

  # Each at least 32 bytes: openssl rand -base64 48
  JWT_ACCESS_SECRET: "<random-secret>"
  OTP_PEPPER: "<random-secret>"
  TOTP_ENC_KEY: "<random-secret>"

  CLOUDINARY_API_SECRET: "<cloudinary-api-secret>"

  # Unset: POST /reviewer/sessions answers 503.
  TURNSTILE_SECRET_KEY: "<turnstile-secret-key>"

  # SMTP_USER and SMTP_PASSWORD: both or neither.
  SMTP_USER: "<smtp-user>"
  SMTP_PASSWORD: "<smtp-password>"

  # Read-only bucket token (list and get), never the backup job's token. Set with the four
  # BACKUP_STORAGE_* settings below, or none of the six.
  BACKUP_STORAGE_ACCESS_KEY_ID: "<read-only-access-key-id>"
  BACKUP_STORAGE_SECRET_ACCESS_KEY: "<read-only-secret-access-key>"

  # Temporary. First install only (at least 32 bytes: openssl rand -base64 32); remove after the
  # owner exists, then re-apply and restart.
  # OWNER_SETUP_TOKEN: "<random-secret>"
  # TOTP key rotation only, both or neither, and the id must differ from TOTP_ENC_KID.
  # TOTP_ENC_PREVIOUS_KEY: "<previous-totp-key>"

  # ══ plain settings (not secret per the docs; here because only the pod reads them) ═══════════
  # Same value in api-init-secrets: NODE_ENV, DB_HOST, DB_PORT, DB_NAME, DB_SSL_MODE,
  # DB_SSL_ROOT_CERT_PATH.
  # Docs value: production (turns on the production guards).
  NODE_ENV: "<node-env>"
  # Session pooler host exactly as in the certificate.
  DB_HOST: "<db-host>"
  # Docs value: 5432 (session pooler); never 6543.
  DB_PORT: "<db-port>"
  DB_NAME: "<db-name>"
  # Docs value: verify-full on Supabase (require is not used in production; disable only for an
  # in-cluster Postgres). Never pick a weaker mode to get past a missing CA mount.
  # verify-full needs the file at DB_SSL_ROOT_CERT_PATH: apps/cms-api/deployment.yaml mounts
  # database-ca-configmap at /etc/abyss/database-ca. With the file missing the process stops at
  # boot, naming DB_SSL_ROOT_CERT_PATH.
  DB_SSL_MODE: "<db-ssl-mode>"
  # Absolute path of the mounted CA file; required with verify-full.
  DB_SSL_ROOT_CERT_PATH: "<ca-file-path>"

  # Number of proxies that append to X-Forwarded-For (deployment/k3s-traefik.md section 2).
  TRUST_PROXY_HOPS: "<proxy-hops>"
  # Only behind Cloudflare, and only when the origin accepts Cloudflare ranges alone.
  # CLIENT_IP_HEADER: "<client-ip-header>"

  # Scheme + host, no trailing slash. ADMIN_ORIGIN is the only CORS origin.
  ADMIN_ORIGIN: "https://<admin-host>.<domain>"
  WEB_ORIGIN: "https://<domain>"

  # Docs value: smtp (console is rejected in production). The SMTP_* settings go with smtp.
  MAIL_PROVIDER: "<mail-provider>"
  SMTP_HOST: "<smtp-host>"
  SMTP_PORT: "<smtp-port>"
  SMTP_SECURE: "<true-or-false>"
  MAIL_FROM: "<display-name> <<sender-address>>"

  # Docs value: cloudinary (fake is rejected in production).
  MEDIA_PROVIDER: "<media-provider>"
  CLOUDINARY_CLOUD_NAME: "<cloud-name>"
  CLOUDINARY_API_KEY: "<api-key>"
  CLOUDINARY_FOLDER: "<folder>"

  TURNSTILE_EXPECTED_HOSTNAME: "<domain>"

  # Key ids: change each together with its secret when rotating.
  JWT_ACCESS_KID: "<key-id>"
  TOTP_ENC_KID: "<key-id>"
  # TOTP_ENC_PREVIOUS_KID: "<previous-key-id>"
  # Name shown in authenticator apps.
  TOTP_ISSUER: "<issuer-name>"

  # Backup download: all six BACKUP_STORAGE_* keys or none (none turns the Backups page off).
  BACKUP_STORAGE_ENDPOINT: "https://<account-id>.<object-storage-host>"
  BACKUP_STORAGE_REGION: "<region>"
  BACKUP_STORAGE_BUCKET: "<bucket>"
  BACKUP_STORAGE_PREFIX: "<prefix>"

  # ══ old config: from the previous example, no equivalent in the deployment docs ══════════════
  # Verify each against apps/cms-api/.env.example (verification reference only), then use or drop.
  # JWT_REFRESH_SECRET: "<random-secret>"
  # COOKIE_SECURE: "<true-or-false>"
  # COOKIE_SAMESITE: "<samesite>"
  # CONTENT_TYPES_DIR: "<directory>"
  # MEDIA_MAX_UPLOAD_BYTES: "<bytes>"
  # AWS_REGION: "<region>"
  # AWS_S3_BUCKET: "<bucket>"
  # GMAIL_CLIENT_ID: "<client-id>"
  # GMAIL_CLIENT_SECRET: "<client-secret>"
  # GMAIL_REFRESH_TOKEN: "<refresh-token>"
  # GMAIL_SENDER_EMAIL: "<sender-address>"
  # RESEND_API_KEY: "<api-key>"
  # BREVO_API_KEY: "<api-key>"
  # REDIS_ENABLED: "<true-or-false>"
  # REDIS_URL: "<redis-url>"
