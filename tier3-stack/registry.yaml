# In-cluster artifact registry for the tier 3 stack (ADR-0003 section 2). Applied by cluster.sh, not by Flux:
# it must exist before Flux has a source. Plain HTTP, ClusterIP only, no Ingress, data lost on pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tier3-registry
  namespace: project-me-tier3
  labels:
    app.kubernetes.io/name: tier3-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tier3-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tier3-registry
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3.1.2
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tier3-registry
  namespace: project-me-tier3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tier3-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
